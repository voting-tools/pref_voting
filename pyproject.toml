[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pref_voting"
version = "1.18.2"
description = "pref_voting is a Python package that contains tools to reason about elections and margin graphs, and implementations of voting methods."
authors = [
    { name = "Eric Pacuit", email = "epacuit@umd.edu" },
    { name = "Wes Holliday", email = "wesholliday@berkeley.edu" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.0.0,<2",
    "networkx>=3.0,<4",
    "tabulate>=0.9.0,<0.10",
    "random2>=1.0.1,<2",
    "matplotlib>=3.5.2,<4",
    "nashpy>=0.0.40,<0.0.41",
    "numba>=0.61.0,<0.63",
    "ortools>=9.8.0,<10",
    "prefsampling>=0.1.16,<0.2",
    "filelock>=3.12.2,<4",
    "preflibtools>=2.0.22,<3",
    "seaborn>=0.13.2,<0.14",
    "pathos>=0.3.3,<0.4",
    "tqdm>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/voting-tools/pref_voting"
Repository = "https://github.com/voting-tools/pref_voting"

[project.optional-dependencies]
abcvoting = ["abcvoting>=2.19,<3"]
# votekit supports Python >= 3.11, < 3.14; on other versions the extra is a no-op
# and the interface functions raise an informative ImportError.
votekit = ["votekit>=3.4,<4; python_version >= '3.11' and python_version < '3.14'"]
interfaces = [
    "abcvoting>=2.19,<3",
    "votekit>=3.4,<4; python_version >= '3.11' and python_version < '3.14'",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pyflakes>=3.0.0",
]

[tool.uv.build-backend]
module-name = "pref_voting"
module-root = ""
source-exclude = [
    "pref_voting/htmlcov",
    "pref_voting/htmlcov/**",
    "pref_voting/.claude",
    "pref_voting/.claude/**",
    "**/.coverage",
    "**/.DS_Store",
]
wheel-exclude = [
    "pref_voting/htmlcov",
    "pref_voting/htmlcov/**",
    "pref_voting/.claude",
    "pref_voting/.claude/**",
    "**/.coverage",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
filterwarnings = [
    # plot display methods call plt.show(); under the non-interactive Agg backend
    # used for tests (see tests/conftest.py) this is a harmless no-op that warns.
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
    # import-time noise from a SWIG-wrapped C-extension dependency (SwigPyObject,
    # SwigPyPacked, swigvarlink); nothing to do with pref_voting.
    'ignore:builtin type \w+ has no __module__ attribute:DeprecationWarning',
]
